<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tabela Periódica</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px 0;
        }

        button {
            margin-top: 10px;
            padding: 8px;
            width: 100%;
            border: none;
            background: #2196f3;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .container {
            display: flex;
            gap: 30px;
            padding: 20px;
        }

        .tabela {
            display: grid;
            grid-template-columns: repeat(18, 55px);
            grid-auto-rows: 60px;
            gap: 5px;
        }

        .elemento {
            width: 55px;
            height: 60px;
            border: 1px solid #000;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .numero {
            font-size: 8px;
        }

        .simbolo {
            font-size: 14px;
            font-weight: bold;
        }

        .nome {
            font-size: 7px;
        }

        .cores {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 120px;
        }

        .cor {
            width: 30px;
            height: 30px;
            cursor: pointer;
            border: 2px solid #000;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 12px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card" id="authArea">
        <h2>Login</h2>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <button onclick="registrar()">Registrar</button>
        <p id="msgEl"></p>
    </div>

    <div id="appArea" class="hidden">
        <button class="logout-btn" onclick="logout()">Sair</button>

        <div class="container">
            <div class="tabela" id="tabela"></div>

            <div class="cores">
                <div class="cor" style="background:red;" onclick="selecionarCor('red')"></div>
                <div class="cor" style="background:blue;" onclick="selecionarCor('blue')"></div>
                <div class="cor" style="background:green;" onclick="selecionarCor('green')"></div>
                <div class="cor" style="background:yellow;" onclick="selecionarCor('yellow')"></div>
                <div class="cor" style="background:orange;" onclick="selecionarCor('orange')"></div>
                <div class="cor" style="background:purple;" onclick="selecionarCor('purple')"></div>
                <div class="cor" style="background:pink;" onclick="selecionarCor('pink')"></div>
                <div class="cor" style="background:brown;" onclick="selecionarCor('brown')"></div>
                <div class="cor" style="background:cyan;" onclick="selecionarCor('cyan')"></div>
                <div class="cor" style="background:lime;" onclick="selecionarCor('lime')"></div>
                <div class="cor" style="background:gray;" onclick="selecionarCor('gray')"></div>
                <div class="cor" style="background:black;" onclick="selecionarCor('black')"></div>

                <button onclick="resetar()">Resetar</button>
            </div>
        </div>
    </div>

    <script>
        // LOGIN
        function registrar() {
            let u = document.getElementById("usuario").value;
            let s = document.getElementById("senha").value;
            if (!u || !s) return msg("Preencha tudo");
            if (localStorage.getItem("user_" + u)) return msg("Usuário já existe");
            localStorage.setItem("user_" + u, s);
            msg("Conta criada com sucesso!");
        }

        function login() {
            let u = document.getElementById("usuario").value;
            let s = document.getElementById("senha").value;
            if (localStorage.getItem("user_" + u) === s) {
                localStorage.setItem("logado", u);
                document.getElementById("authArea").classList.add("hidden");
                document.getElementById("appArea").classList.remove("hidden");
                carregarCores();
            } else msg("Usuário ou senha incorretos");
        }

        function logout() {
            localStorage.removeItem("logado");
            location.reload();
        }

        // FIX: msgEl agora aponta para o elemento correto (id="msgEl")
        function msg(t) { document.getElementById("msgEl").innerText = t; }

        window.onload = () => {
            let u = localStorage.getItem("logado");
            if (u) {
                document.getElementById("authArea").classList.add("hidden");
                document.getElementById("appArea").classList.remove("hidden");
                carregarCores();
            }
        };

        // CORES
        let corAtual = null;
        function selecionarCor(c) { corAtual = c; }

        function salvarCores() {
            let u = localStorage.getItem("logado");
            let cores = [];
            document.querySelectorAll(".elemento").forEach((el, i) => {
                cores[i] = el.style.background || "";
            });
            localStorage.setItem("cores_" + u, JSON.stringify(cores));
        }

        function carregarCores() {
            let u = localStorage.getItem("logado");
            let cores = JSON.parse(localStorage.getItem("cores_" + u) || "[]");
            document.querySelectorAll(".elemento").forEach((el, i) => {
                el.style.background = cores[i] || "white";
            });
        }

        function resetar() {
            document.querySelectorAll(".elemento").forEach(el => el.style.background = "white");
            salvarCores();
        }

        elementos.forEach((e) => {

            d.className = "elemento";
            d.style.gridColumn = e[3];
            d.style.gridRow = e[4];  // FIX: posicionamento correto na grade
            d.innerHTML = `
    <div class="numero">${e[0]}</div>
    <div class="simbolo">${e[1]}</div>

</html>
