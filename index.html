<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tabela Periódica</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="card" id="authArea">
        <h2>Login</h2>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <button onclick="registrar()">Registrar</button>
        <p id="msgEl"></p>
    </div>

    <div id="appArea" class="hidden">
        <button class="logout-btn" onclick="logout()">Sair</button>

        <div class="container">
            <div class="tabela" id="tabela"></div>

            <div class="cores">
                <div class="cor" style="background:red;" onclick="selecionarCor('red')"></div>
                <div class="cor" style="background:blue;" onclick="selecionarCor('blue')"></div>
                <div class="cor" style="background:green;" onclick="selecionarCor('green')"></div>
                <div class="cor" style="background:yellow;" onclick="selecionarCor('yellow')"></div>
                <div class="cor" style="background:orange;" onclick="selecionarCor('orange')"></div>
                <div class="cor" style="background:purple;" onclick="selecionarCor('purple')"></div>
                <div class="cor" style="background:pink;" onclick="selecionarCor('pink')"></div>
                <div class="cor" style="background:brown;" onclick="selecionarCor('brown')"></div>
                <div class="cor" style="background:cyan;" onclick="selecionarCor('cyan')"></div>
                <div class="cor" style="background:lime;" onclick="selecionarCor('lime')"></div>
                <div class="cor" style="background:gray;" onclick="selecionarCor('gray')"></div>
                <div class="cor" style="background:black;" onclick="selecionarCor('black')"></div>

                <button onclick="resetar()">Resetar</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
